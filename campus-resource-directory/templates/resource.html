<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{NAME}}</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #f4f4f4;
        color: #222;
      }

      header {
        background-color: #1f4e79;
        color: white;
        padding: 20px;
        text-align: center;
      }

      main {
        width: 90%;
        max-width: 700px;
        margin: 30px auto;
      }

      .resource-details {
        background-color: white;
        padding: 25px;
        border-radius: 8px;
        border: 1px solid #ddd;
      }

      .back-link {
        display: inline-block;
        margin-top: 20px;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>{{NAME}}</h1>
    </header>

    <main>
      <div class="resource-details">
        <p>
          <strong>ID:</strong>
          {{ID}}
        </p>

        <p>
          <strong>Category:</strong>
          {{CATEGORY}}
        </p>

        <p>
          <strong>Location:</strong>
          {{LOCATION}}
        </p>

        <p>
          <strong>Description:</strong>
          {{DESCRIPTION}}
        </p>

        <p>
          <strong>Contact / Website:</strong>
          {{CONTACT}}
        </p>

        <a class="back-link" href="/"> Back to Resources </a>
      </div>
    </main>
  </body>
</html>
